name: eligibility-security-tests
on:
  push:
    paths: ["app/**", "tests/**", "frontend/**", "requirements.txt", "pytest.ini", ".github/workflows/eligibility-tests.yml"]
  pull_request:
    paths: ["app/**", "tests/**", "frontend/**", "requirements.txt", "pytest.ini", ".github/workflows/eligibility-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt bandit pip-audit
      - name: Platform security and integration tests
        run: python -m pytest -q
      - name: Static security scan (Bandit)
        run: bandit -q -r app/eligibility -ll
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
